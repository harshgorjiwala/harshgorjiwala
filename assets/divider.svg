<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 16" width="1000" height="16" role="img" aria-label="divider">
<defs>
  <linearGradient id="dl" x1="0" x2="1"><stop offset="0" stop-color="#818cf8" stop-opacity="0"/><stop offset="0.5" stop-color="#818cf8" stop-opacity="0.5"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></linearGradient>
  <linearGradient id="dt" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#22d3ee" stop-opacity="1"/></linearGradient>
  <filter id="dg" x="-100%" y="-300%" width="300%" height="700%"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
<style>
  .run { animation: run 5s cubic-bezier(.45,.05,.55,.95) infinite; }
  @keyframes run { 0% { transform: translateX(-160px); opacity: 0;} 8% { opacity: 1;} 92% { opacity: 1;} 100% { transform: translateX(1010px); opacity: 0;} }
</style>
<line x1="0" y1="8" x2="1000" y2="8" stroke="url(#dl)" stroke-width="1"/>
<g class="run">
  <rect x="0" y="7" width="140" height="2" rx="1" fill="url(#dt)"/>
  <circle cx="140" cy="8" r="4" fill="#22d3ee" filter="url(#dg)" opacity="0.9"/>
  <circle cx="140" cy="8" r="2.2" fill="#e0fbff"/>
</g>
</svg>
