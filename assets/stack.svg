<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-labelledby="sTitle">
<title id="sTitle">Stack: .NET 8, C#, PostgreSQL, React 18, TypeScript, Claude Code; exploring Three.js</title>
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1422"/><stop offset="1" stop-color="#0a0e19"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="hlGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/>
  </linearGradient>
  <clipPath id="rowClip">
    <rect x="33" y="37" width="100" height="46" rx="23"/><rect x="147" y="37" width="72" height="46" rx="23"/>
    <rect x="233" y="37" width="136" height="46" rx="23"/><rect x="383" y="37" width="112" height="46" rx="23"/>
    <rect x="509" y="37" width="130" height="46" rx="23"/><rect x="653" y="37" width="140" height="46" rx="23"/>
    <rect x="807" y="37" width="160" height="46" rx="23"/>
  </clipPath>
</defs>
<style>
  .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .chip { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; animation: pop .7s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.7) translateY(10px);} to { opacity: 1; transform: scale(1) translateY(0);} }
  /* "hover tour": each chip lights up in turn, 2s each, 14s loop */
  .hl { opacity: 0; animation: hl 14s ease-in-out infinite; }
  @keyframes hl { 0% { opacity: 0;} 3% { opacity: 1;} 11% { opacity: 1;} 14.3%,100% { opacity: 0;} }
  .dot { transform-box: fill-box; transform-origin: 50% 50%; animation: dot 14s ease-in-out infinite; }
  @keyframes dot { 0% { transform: scale(1);} 4% { transform: scale(1.5);} 11% { transform: scale(1.5);} 14.3%,100% { transform: scale(1);} }
  .lift { animation: lift 14s ease-in-out infinite; }
  @keyframes lift { 0% { transform: translateY(0);} 3% { transform: translateY(-4px);} 11% { transform: translateY(-4px);} 14.3%,100% { transform: translateY(0);} }
  .sheen { animation: sheen 6s ease-in-out 1.5s infinite; }
  @keyframes sheen { 0% { transform: translateX(-200px) skewX(-25deg);} 60%,100% { transform: translateX(1100px) skewX(-25deg);} }
</style>

<rect width="1000" height="120" rx="20" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.08"/>
<text class="mono" x="33" y="24" font-size="9.5" font-weight="600" letter-spacing="2" fill="#5b6b85">DAILY DRIVERS</text>
<text class="mono" x="967" y="24" font-size="9.5" font-weight="600" letter-spacing="2" fill="#5b6b85" text-anchor="end">ON THE BENCH</text>
<g class="sans" font-size="14" font-weight="600" fill="#e2e8f0">

  <!-- .NET 8 -->
  <g class="chip" style="animation-delay:.05s"><g class="lift" style="animation-delay:1s">
    <rect x="33" y="37" width="100" height="46" rx="23" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect class="hl" style="animation-delay:1s" x="33" y="37" width="100" height="46" rx="23" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.9" stroke-width="1.5"/>
    <circle class="dot" style="animation-delay:1s" cx="55" cy="60" r="5" fill="#a78bfa"/>
    <text x="70" y="65">.NET 8</text>
  </g></g>

  <!-- C# -->
  <g class="chip" style="animation-delay:.15s"><g class="lift" style="animation-delay:3s">
    <rect x="147" y="37" width="72" height="46" rx="23" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect class="hl" style="animation-delay:3s" x="147" y="37" width="72" height="46" rx="23" fill="#c084fc" fill-opacity="0.12" stroke="#c084fc" stroke-opacity="0.9" stroke-width="1.5"/>
    <circle class="dot" style="animation-delay:3s" cx="169" cy="60" r="5" fill="#c084fc"/>
    <text x="184" y="65">C#</text>
  </g></g>

  <!-- PostgreSQL -->
  <g class="chip" style="animation-delay:.25s"><g class="lift" style="animation-delay:5s">
    <rect x="233" y="37" width="136" height="46" rx="23" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect class="hl" style="animation-delay:5s" x="233" y="37" width="136" height="46" rx="23" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.9" stroke-width="1.5"/>
    <circle class="dot" style="animation-delay:5s" cx="255" cy="60" r="5" fill="#60a5fa"/>
    <text x="270" y="65">PostgreSQL</text>
  </g></g>

  <!-- React 18 -->
  <g class="chip" style="animation-delay:.35s"><g class="lift" style="animation-delay:7s">
    <rect x="383" y="37" width="112" height="46" rx="23" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect class="hl" style="animation-delay:7s" x="383" y="37" width="112" height="46" rx="23" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.9" stroke-width="1.5"/>
    <circle class="dot" style="animation-delay:7s" cx="405" cy="60" r="5" fill="#22d3ee"/>
    <text x="420" y="65">React 18</text>
  </g></g>

  <!-- TypeScript -->
  <g class="chip" style="animation-delay:.45s"><g class="lift" style="animation-delay:9s">
    <rect x="509" y="37" width="130" height="46" rx="23" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect class="hl" style="animation-delay:9s" x="509" y="37" width="130" height="46" rx="23" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.9" stroke-width="1.5"/>
    <circle class="dot" style="animation-delay:9s" cx="531" cy="60" r="5" fill="#3b82f6"/>
    <text x="546" y="65">TypeScript</text>
  </g></g>

  <!-- Claude Code -->
  <g class="chip" style="animation-delay:.55s"><g class="lift" style="animation-delay:11s">
    <rect x="653" y="37" width="140" height="46" rx="23" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect class="hl" style="animation-delay:11s" x="653" y="37" width="140" height="46" rx="23" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.9" stroke-width="1.5"/>
    <circle class="dot" style="animation-delay:11s" cx="675" cy="60" r="5" fill="#f59e0b"/>
    <text x="690" y="65">Claude Code</text>
  </g></g>

  <!-- Three.js (exploring) -->
  <g class="chip" style="animation-delay:.65s"><g class="lift" style="animation-delay:13s">
    <rect x="807" y="37" width="160" height="46" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-dasharray="5 4"/>
    <rect class="hl" style="animation-delay:13s" x="807" y="37" width="160" height="46" rx="23" fill="#e2e8f0" fill-opacity="0.08" stroke="#e2e8f0" stroke-opacity="0.8" stroke-width="1.5"/>
    <circle class="dot" style="animation-delay:13s" cx="829" cy="60" r="5" fill="none" stroke="#e2e8f0" stroke-width="1.6"/>
    <text x="844" y="65" fill="#cbd5e1">Three.js</text>
    <rect x="906" y="49" width="54" height="20" rx="10" fill="#ffffff" fill-opacity="0.06"/>
    <text class="mono" x="933" y="63" font-size="9" font-weight="600" fill="#94a3b8" text-anchor="middle">exploring</text>
  </g></g>
</g>

<!-- sheen sweep across the row -->
<g clip-path="url(#rowClip)">
  <rect class="sheen" x="0" y="20" width="120" height="80" fill="url(#sheen)"/>
</g>
</svg>
