<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="heroTitle heroDesc">
<title id="heroTitle">Harsh Gorjiwala — founder building vertical SaaS</title>
<desc id="heroDesc">Animated banner with a floating product dashboard mock: live chart, toggle, and a cursor pressing Deploy.</desc>
<defs>
  <clipPath id="frame"><rect width="1000" height="340" rx="24"/></clipPath>
  <clipPath id="winClip"><rect width="340" height="236" rx="14"/></clipPath>
  <clipPath id="typeClip"><rect class="typeRect" x="64" y="192" width="422" height="30"/></clipPath>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#090c14"/>
    <stop offset="1" stop-color="#0f1526"/>
  </linearGradient>
  <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f1f4fb"/>
    <stop offset="0.55" stop-color="#9ec5ff"/>
    <stop offset="1" stop-color="#c4b5fd"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#818cf8"/>
  </linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#818cf8" stop-opacity="0.38"/>
    <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.09"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orbIndigo"><stop offset="0" stop-color="#6366f1" stop-opacity="0.75"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbCyan"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbViolet"><stop offset="0" stop-color="#a855f7" stop-opacity="0.6"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.07"/></pattern>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<style>
  .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }

  /* ambient orbs */
  .orb1 { animation: drift1 16s ease-in-out infinite; }
  .orb2 { animation: drift2 19s ease-in-out infinite; }
  .orb3 { animation: drift3 14s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0);} 50% { transform: translate(70px,40px);} }
  @keyframes drift2 { 0%,100% { transform: translate(0,0);} 50% { transform: translate(-60px,-50px);} }
  @keyframes drift3 { 0%,100% { transform: translate(0,0);} 50% { transform: translate(40px,60px);} }

  /* entrance reveals */
  .up { opacity: 0; animation: up .9s cubic-bezier(.2,.8,.2,1) both; }
  .d1 { animation-delay: .15s } .d2 { animation-delay: .35s } .d3 { animation-delay: 3.9s } .d4 { animation-delay: 4.1s } .d5 { animation-delay: 4.3s }
  @keyframes up { from { opacity: 0; transform: translateY(14px);} to { opacity: 1; transform: translateY(0);} }

  /* typewriter */
  .typeRect { transform-origin: 64px 192px; transform: scaleX(0); animation: type 2.5s steps(41,end) 1.2s forwards; }
  @keyframes type { from { transform: scaleX(0);} to { transform: scaleX(1);} }
  .caret { animation: caretX 2.5s steps(41,end) 1.2s forwards, blink .85s step-end 3.75s infinite; }
  @keyframes caretX { from { transform: translateX(0);} to { transform: translateX(422px);} }
  @keyframes blink { 0%,100% { opacity: 1;} 50% { opacity: 0;} }

  /* status dot */
  .pulse { transform-box: fill-box; transform-origin: 50% 50%; animation: pulse 2s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .9;} 100% { transform: scale(3.2); opacity: 0;} }

  /* window */
  .winIn { opacity: 0; animation: winIn 1.1s cubic-bezier(.2,.8,.2,1) .5s both; }
  @keyframes winIn { from { opacity: 0; transform: translate(40px,24px) scale(.96);} to { opacity: 1; transform: translate(0,0) scale(1);} }
  .float { animation: float 7s ease-in-out 1.6s infinite; }
  @keyframes float { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-7px);} }
  .shine { animation: shine 7s ease-in-out 2s infinite; }
  @keyframes shine { 0% { transform: translateX(-220px) skewX(-20deg);} 35%,100% { transform: translateX(520px) skewX(-20deg);} }

  .sideActive { animation: side 9s ease-in-out 2.2s infinite; }
  @keyframes side { 0%,22% { transform: translateY(0);} 25%,47% { transform: translateY(18px);} 50%,72% { transform: translateY(36px);} 75%,97% { transform: translateY(54px);} 100% { transform: translateY(0);} }

  .tile { opacity: 0; animation: up .7s cubic-bezier(.2,.8,.2,1) both; }
  .bar { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); animation: grow .9s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes grow { from { transform: scaleY(0);} to { transform: scaleY(1);} }
  .line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s cubic-bezier(.4,0,.2,1) 2.3s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0;} }
  .areaFill { opacity: 0; animation: fade 1s ease 3.6s forwards; }
  @keyframes fade { to { opacity: 1;} }
  .tip { opacity: 0; animation: tipPop .5s cubic-bezier(.2,.8,.2,1) 4.1s forwards; }
  @keyframes tipPop { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

  .knob { animation: knob 5s ease-in-out infinite; }
  @keyframes knob { 0%,40% { transform: translateX(0);} 50%,90% { transform: translateX(16px);} 100% { transform: translateX(0);} }
  .track { animation: track 5s ease-in-out infinite; }
  @keyframes track { 0%,40% { fill: #2b3447;} 50%,90% { fill: #22d3ee;} 100% { fill: #2b3447;} }

  .cursor { animation: cur 6s cubic-bezier(.45,.05,.3,1) 2.8s infinite; }
  @keyframes cur { 0% { transform: translate(150px,118px);} 30%,46% { transform: translate(274px,212px);} 72% { transform: translate(120px,160px);} 100% { transform: translate(150px,118px);} }
  .btn { transform-box: fill-box; transform-origin: 50% 50%; animation: press 6s 2.8s infinite; }
  @keyframes press { 0%,32% { transform: scale(1);} 35% { transform: scale(.92);} 39%,100% { transform: scale(1);} }
  .ripple { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; animation: rip 6s 2.8s infinite; }
  @keyframes rip { 0%,33% { transform: scale(.15); opacity: 0;} 35% { opacity: .55;} 58%,100% { transform: scale(1); opacity: 0;} }
  .deployed { opacity: 0; animation: deployed 6s 2.8s infinite; }
  @keyframes deployed { 0%,36% { opacity: 0;} 40%,62% { opacity: 1;} 68%,100% { opacity: 0;} }
</style>

<g clip-path="url(#frame)">
  <rect width="1000" height="340" fill="url(#bg)"/>
  <g class="orb1"><circle cx="150" cy="70" r="230" fill="url(#orbIndigo)"/></g>
  <g class="orb2"><circle cx="860" cy="320" r="220" fill="url(#orbCyan)"/></g>
  <g class="orb3"><circle cx="560" cy="-30" r="190" fill="url(#orbViolet)"/></g>
  <rect width="1000" height="340" fill="url(#dots)"/>
</g>

<!-- ===== left: identity ===== -->
<g class="sans">
  <text class="up d1" x="64" y="112" font-size="14" font-weight="600" letter-spacing="3" fill="#8b9bb4">HEY, I'M</text>
  <text class="up d2" x="62" y="166" font-size="52" font-weight="800" letter-spacing="-1.5" fill="url(#nameGrad)">Harsh Gorjiwala</text>

  <g clip-path="url(#typeClip)">
    <text class="mono" x="64" y="213" font-size="17" fill="#c7d2fe" textLength="422" lengthAdjust="spacing">founder · building vertical SaaS products</text>
  </g>
  <rect class="caret" x="64" y="197" width="9" height="20" rx="1.5" fill="#22d3ee"/>

  <!-- pills -->
  <g class="up d3">
    <rect x="64" y="246" width="164" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <path d="M82 254.5a5.5 5.5 0 0 1 5.5 5.5c0 4-5.5 9-5.5 9s-5.5-5-5.5-9a5.5 5.5 0 0 1 5.5-5.5z" fill="none" stroke="#9ec5ff" stroke-width="1.5"/>
    <circle cx="82" cy="260" r="1.6" fill="#9ec5ff"/>
    <text x="156" y="265.5" font-size="12.5" font-weight="600" fill="#d4dcea" text-anchor="middle">Hamilton, Ontario</text>
  </g>
  <g class="up d4">
    <rect x="238" y="246" width="190" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text class="mono" x="333" y="265" font-size="12" fill="#c7d2fe" text-anchor="middle">.NET 8 · React · Postgres</text>
  </g>
  <g class="up d5">
    <rect x="438" y="246" width="140" height="30" rx="15" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.35"/>
    <circle class="pulse" cx="456" cy="261" r="4" fill="#34d399" fill-opacity="0.5"/>
    <circle cx="456" cy="261" r="4" fill="#34d399"/>
    <text x="514" y="265.5" font-size="12.5" font-weight="600" fill="#a7f3d0" text-anchor="middle">Actively building</text>
  </g>
</g>

<!-- ===== right: floating product window ===== -->
<g transform="translate(612,56)">
 <g class="winIn">
  <g class="float">
   <rect x="6" y="14" width="340" height="236" rx="18" fill="#000" opacity="0.45" filter="url(#softGlow)"/>
   <g clip-path="url(#winClip)">
    <rect width="340" height="236" fill="#0f1524"/>
    <rect width="340" height="236" fill="#ffffff" fill-opacity="0.02"/>
    <!-- title bar -->
    <rect width="340" height="30" fill="#ffffff" fill-opacity="0.035"/>
    <circle cx="16" cy="15" r="4.5" fill="#ff5f57" opacity="0.85"/>
    <circle cx="30" cy="15" r="4.5" fill="#febc2e" opacity="0.85"/>
    <circle cx="44" cy="15" r="4.5" fill="#28c840" opacity="0.85"/>
    <text class="mono" x="64" y="19" font-size="10.5" fill="#6f7f98">klinova — dashboard</text>
    <rect x="262" y="8" width="62" height="14" rx="7" fill="#34d399" fill-opacity="0.12"/>
    <circle cx="272" cy="15" r="2.5" fill="#34d399"/>
    <text class="mono" x="279" y="18.5" font-size="8.5" font-weight="600" fill="#a7f3d0">LIVE</text>
    <line x1="0" y1="30.5" x2="340" y2="30.5" stroke="#ffffff" stroke-opacity="0.07"/>

    <!-- sidebar -->
    <rect y="31" width="64" height="205" fill="#ffffff" fill-opacity="0.02"/>
    <line x1="64.5" y1="31" x2="64.5" y2="236" stroke="#ffffff" stroke-opacity="0.06"/>
    <rect class="sideActive" x="4" y="46" width="3" height="10" rx="1.5" fill="#818cf8"/>
    <rect x="16" y="48" width="34" height="6" rx="3" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="16" y="66" width="26" height="6" rx="3" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="16" y="84" width="30" height="6" rx="3" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="16" y="102" width="22" height="6" rx="3" fill="#ffffff" fill-opacity="0.12"/>
    <circle cx="20" cy="218" r="6" fill="url(#accent)"/>
    <rect x="30" y="215" width="22" height="6" rx="3" fill="#ffffff" fill-opacity="0.12"/>

    <!-- stat tiles -->
    <g class="sans">
      <g class="tile" style="animation-delay:1.4s">
        <rect x="76" y="42" width="74" height="44" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07"/>
        <text x="86" y="57" font-size="8.5" fill="#7c8aa3">Rx today</text>
        <text x="86" y="76" font-size="15" font-weight="700" fill="#eef2ff">1,284</text>
      </g>
      <g class="tile" style="animation-delay:1.6s">
        <rect x="158" y="42" width="74" height="44" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07"/>
        <text x="168" y="57" font-size="8.5" fill="#7c8aa3">Uptime</text>
        <text x="168" y="76" font-size="15" font-weight="700" fill="#eef2ff">99.98%</text>
      </g>
      <g class="tile" style="animation-delay:1.8s">
        <rect x="240" y="42" width="74" height="44" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07"/>
        <text x="250" y="57" font-size="8.5" fill="#7c8aa3">p95 latency</text>
        <text x="250" y="76" font-size="15" font-weight="700" fill="#eef2ff">42<tspan font-size="9" fill="#9ec5ff"> ms</tspan></text>
      </g>
    </g>

    <!-- chart -->
    <g>
      <line x1="76" y1="190.5" x2="314" y2="190.5" stroke="#ffffff" stroke-opacity="0.08"/>
      <line x1="76" y1="160.5" x2="314" y2="160.5" stroke="#ffffff" stroke-opacity="0.04" stroke-dasharray="2 3"/>
      <line x1="76" y1="130.5" x2="314" y2="130.5" stroke="#ffffff" stroke-opacity="0.04" stroke-dasharray="2 3"/>
      <rect class="bar" style="animation-delay:1.9s" x="78"  y="162" width="12" height="28" rx="3" fill="#818cf8" fill-opacity="0.28"/>
      <rect class="bar" style="animation-delay:2.0s" x="98"  y="146" width="12" height="44" rx="3" fill="#818cf8" fill-opacity="0.28"/>
      <rect class="bar" style="animation-delay:2.1s" x="118" y="154" width="12" height="36" rx="3" fill="#818cf8" fill-opacity="0.28"/>
      <rect class="bar" style="animation-delay:2.2s" x="138" y="134" width="12" height="56" rx="3" fill="#818cf8" fill-opacity="0.28"/>
      <rect class="bar" style="animation-delay:2.3s" x="158" y="140" width="12" height="50" rx="3" fill="#818cf8" fill-opacity="0.28"/>
      <rect class="bar" style="animation-delay:2.4s" x="178" y="124" width="12" height="66" rx="3" fill="#818cf8" fill-opacity="0.28"/>
      <rect class="bar" style="animation-delay:2.5s" x="198" y="132" width="12" height="58" rx="3" fill="#818cf8" fill-opacity="0.28"/>
      <rect class="bar" style="animation-delay:2.6s" x="218" y="116" width="12" height="74" rx="3" fill="#818cf8" fill-opacity="0.28"/>
      <rect class="bar" style="animation-delay:2.7s" x="238" y="122" width="12" height="68" rx="3" fill="#818cf8" fill-opacity="0.28"/>
      <rect class="bar" style="animation-delay:2.8s" x="258" y="108" width="12" height="82" rx="3" fill="#818cf8" fill-opacity="0.28"/>
      <rect class="bar" style="animation-delay:2.9s" x="278" y="112" width="12" height="78" rx="3" fill="#818cf8" fill-opacity="0.28"/>
      <rect class="bar" style="animation-delay:3.0s" x="298" y="100" width="12" height="90" rx="3" fill="url(#accent)" fill-opacity="0.9"/>
      <path class="areaFill" d="M84 158 L104 142 L124 150 L144 130 L164 136 L184 120 L204 128 L224 112 L244 118 L264 104 L284 108 L304 96 L304 190 L84 190 Z" fill="url(#area)"/>
      <path class="line" pathLength="1" d="M84 158 L104 142 L124 150 L144 130 L164 136 L184 120 L204 128 L224 112 L244 118 L264 104 L284 108 L304 96" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="tip">
        <circle cx="304" cy="96" r="3.5" fill="#22d3ee" stroke="#0f1524" stroke-width="2"/>
        <rect x="238" y="88" width="50" height="16" rx="5" fill="#1b2335" stroke="#ffffff" stroke-opacity="0.1"/>
        <path d="M288 96 l5 0" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
        <text class="mono" x="263" y="99" font-size="8.5" font-weight="600" fill="#9ec5ff" text-anchor="middle">+38.4%</text>
      </g>
    </g>

    <!-- bottom controls -->
    <g class="sans">
      <rect class="track" x="76" y="205" width="34" height="18" rx="9" fill="#2b3447"/>
      <circle class="knob" cx="85" cy="214" r="6.5" fill="#f8fafc"/>
      <text x="118" y="217.5" font-size="10" fill="#aab6c9">Auto-sync faxes</text>
      <circle class="ripple" cx="277" cy="214" r="40" fill="#818cf8"/>
      <g class="btn">
        <rect x="238" y="202" width="78" height="24" rx="8" fill="url(#accent)"/>
        <text x="277" y="218" font-size="10.5" font-weight="700" fill="#0b1020" text-anchor="middle">Deploy</text>
      </g>
      <g class="deployed">
        <rect x="244" y="176" width="72" height="18" rx="6" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.4"/>
        <path d="M253 185 l3 3 l6 -6" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="mono" x="267" y="188.5" font-size="8.5" font-weight="600" fill="#a7f3d0">Deployed</text>
      </g>
    </g>

    <!-- shine sweep -->
    <rect class="shine" x="0" y="-40" width="110" height="320" fill="url(#shine)"/>
   </g>
   <rect width="340" height="236" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

   <!-- cursor -->
   <g class="cursor">
     <path d="M0 0 L0 15.5 L4.2 12 L7 18 L9.6 16.8 L6.8 11 L12 11 Z" fill="#ffffff" stroke="#0b1020" stroke-width="1.2" stroke-linejoin="round"/>
   </g>
  </g>
 </g>
</g>
</svg>
